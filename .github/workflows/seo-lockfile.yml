name: seo-build-validation

on:
  workflow_dispatch:
  push:
    branches:
      - seo-metadata

permissions:
  contents: write

concurrency:
  group: seo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-metadata
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with dummy public env
        run: npm run build
      - name: Start and inspect generated output
        run: |
          set -euo pipefail
          npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          for route in / /resources /opportunities /aashraya /samskara; do
            echo "=== $route HEAD ==="
            curl -fsS "http://127.0.0.1:3000$route" | sed -n '/<head>/,/<\/head>/p'
          done
          echo "=== /robots.txt ==="
          curl -fsS http://127.0.0.1:3000/robots.txt
          echo
          echo "=== /sitemap.xml ==="
          curl -fsS http://127.0.0.1:3000/sitemap.xml
          echo
          echo "=== private /sign-in robots ==="
          curl -fsS http://127.0.0.1:3000/sign-in | grep -o '<meta[^>]*robots[^>]*>' || true
          echo "=== private /dashboard robots ==="
          curl -fsS http://127.0.0.1:3000/dashboard | grep -o '<meta[^>]*robots[^>]*>' || true
          echo "=== server log ==="
          cat /tmp/next-start.log
      - name: Stop server
        if: always()
        run: |
          if test -f /tmp/next.pid; then kill "$(cat /tmp/next.pid)" || true; fi
