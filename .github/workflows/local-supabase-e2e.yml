name: local-supabase-e2e

on:
  push:
    branches:
      - main
      - phase2-safety-reconciliation
  pull_request:

jobs:
  local-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci
      - run: supabase start

      - name: Configure local Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_AUTH_ISSUER=$API_URL/auth/v1"
          } >> .env.local

      - run: npm run build

      - name: Start production server
        run: |
          nohup npm run start > /tmp/sficusatapp-next.log 2>&1 &
          npx wait-on http://127.0.0.1:3000

      - name: Run Playwright against local server only
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/local-smoke.spec.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
