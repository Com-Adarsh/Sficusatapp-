name: SEO metadata validation

on:
  push:
    branches: ["seo-metadata"]
    paths:
      - "app/**"
      - "lib/seo.ts"
      - "public/logos/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/seo-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''
      - run: npm install
      - run: npm run build
      - name: Inspect generated route head and SEO files
        shell: bash
        run: |
          npm start > /tmp/next.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          for path in / /resources /opportunities /aashraya /samskara; do
            echo "=== HEAD $path ==="
            curl -fsS "http://127.0.0.1:3000$path" | tr '\n' ' ' | sed 's/></>\n</g' | grep -E '<title>|<meta name="description"|<link rel="canonical"|<meta name="robots"|<meta property="og:' || true
          done
          echo "=== robots.txt ==="
          curl -fsS http://127.0.0.1:3000/robots.txt
          echo
          echo "=== sitemap.xml ==="
          curl -fsS http://127.0.0.1:3000/sitemap.xml
          echo
          echo "=== JS manifest entries for / and /ai ==="
          node - <<'NODE'
          const fs = require("fs");
          const path = ".next/server/app-build-manifest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          for (const route of ["/", "/ai"]) {
            console.log(route, JSON.stringify(manifest.pages?.[route] ?? manifest.rootMainFiles ?? [], null, 2));
          }
          NODE
          echo "=== Largest client chunks ==="
          find .next/static/chunks -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -20
