name: SEO head inspection

on:
  push:
    branches: ["seo-metadata"]
    paths:
      - "app/**"
      - "lib/seo.ts"
      - "public/logos/**"
      - "package.json"
      - ".github/workflows/seo-head.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""
      - run: npm install
      - name: Start Next dev server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/next-dev.log
          exit 1
      - name: Inspect generated head and SEO files
        run: |
          for path in / /resources /opportunities /aashraya /samskara; do
            echo "=== HEAD $path ==="
            curl -fsS "http://127.0.0.1:3000$path" | tr '\n' ' ' | sed 's/></>\n</g' | grep -E '<title>|<meta name="description"|<link rel="canonical"|<meta name="robots"|<meta property="og:' || true
          done
          echo "=== robots.txt ==="
          curl -fsS http://127.0.0.1:3000/robots.txt
          echo
          echo "=== sitemap.xml ==="
          curl -fsS http://127.0.0.1:3000/sitemap.xml
          echo
