name: postgres-only-auth-hardening

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/**"
      - "scripts/assert-dev-supabase.ts"
      - "lib/auth/**"
      - "lib/grievances/**"
      - "tests/**"
      - ".github/workflows/postgres-only-auth-hardening.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/assert-dev-supabase.ts"
      - "lib/auth/**"
      - "lib/grievances/**"
      - "tests/**"
      - ".github/workflows/postgres-only-auth-hardening.yml"

jobs:
  postgres-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGOPTIONS: "-c app.settings.project_ref=ci-postgres -c request.jwt.claim.role=authenticated -c request.jwt.claim.sub=10000000-0000-0000-0000-000000000001"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install pgTAP in plain Postgres service
        run: |
          set -euo pipefail
          cid="$(docker ps --filter ancestor=pgvector/pgvector:pg17 --format '{{.ID}}' | head -n1)"
          test -n "$cid"
          docker exec "$cid" bash -lc 'apt-get update -qq && apt-get install -y -qq postgresql-17-pgtap'
          docker exec "$cid" bash -lc 'pg_isready -U postgres -d postgres'

      - name: Bootstrap auth/storage shim
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/auth_shim.sql

      - name: Apply current production migration lineage from empty database
        run: |
          set -euo pipefail
          # Legacy 0001-0009 migrations are superseded by the Phase-1 foundation
          # and cannot be replayed together with it (0001 creates incompatible
          # profiles/user_roles tables). 202611210001 is the duplicate draft of
          # 20261121161700 and is likewise not replayable before the actual
          # foundation. The production snapshot identifies 20261121161700 as
          # the exact recovered Phase-1 foundation.
          for f in \
            supabase/migrations/20261121161700_phase1_foundation_actual.sql \
            supabase/migrations/20261121162000_phase2_security_performance.sql \
            supabase/migrations/20261121162500_phase2_advisor_cleanup.sql \
            supabase/migrations/20261121163000_phase2_donor_consent_fix.sql \
            supabase/migrations/20261121170000_phase2_auth_foundation.sql \
            supabase/migrations/20261121171000_phase2_role_rpc.sql \
            supabase/migrations/20261122120000_phase2_rls_hardening.sql; do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply production hotfix candidate
        run: psql -v ON_ERROR_STOP=1 -f supabase/hotfix/handle_new_user_failsafe.sql

      - name: Direct Postgres hotfix tests
        run: psql -v ON_ERROR_STOP=1 -f tests/supabase/handle_new_user_postgres.sql

      - name: Run pgTAP RLS tests as database owner
        run: |
          set -euo pipefail
          for f in supabase/tests/*.sql; do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run TypeScript unit tests
        run: |
          npx tsx tests/unit/assert-dev-supabase.test.ts
          npx tsx tests/unit/ensure-profile.test.ts
          npx tsx tests/unit/grievance-token-cancel.test.ts

      - name: Schema drift check against production snapshot
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "create database snapshot_compare;"
          PGDATABASE=snapshot_compare psql -v ON_ERROR_STOP=1 -f tests/postgres/auth_shim.sql
          PGDATABASE=snapshot_compare psql -v ON_ERROR_STOP=1 -f docs/prod-schema-snapshot.sql
          pg_dump --schema-only --no-owner --no-privileges --no-comments postgres > /tmp/applied-schema.sql
          pg_dump --schema-only --no-owner --no-privileges --no-comments snapshot_compare > /tmp/prod-snapshot-schema.sql
          sed -E '/^--/d;/^SET /d;/^SELECT pg_catalog.set_config/d;/^COMMENT ON EXTENSION/d' /tmp/applied-schema.sql > /tmp/applied-schema.norm
          sed -E '/^--/d;/^SET /d;/^SELECT pg_catalog.set_config/d;/^COMMENT ON EXTENSION/d' /tmp/prod-snapshot-schema.sql > /tmp/prod-snapshot-schema.norm
          if ! diff -u /tmp/prod-snapshot-schema.norm /tmp/applied-schema.norm; then
            echo "Schema drift detected. The diff above is the real result."
            exit 1
          fi
          echo "Schema drift check passed."

      - name: Explicit production-ref guard unit test
        run: |
          npx tsx tests/unit/assert-dev-supabase.test.ts
