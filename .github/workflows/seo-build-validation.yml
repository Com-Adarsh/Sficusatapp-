name: seo-build-validation

on:
  workflow_dispatch:
  push:
    branches:
      - seo-metadata

permissions:
  contents: read

jobs:
  build-and-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with dummy public env
        run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /tmp/home.html
          curl -fsS http://127.0.0.1:3000/resources > /tmp/resources.html
          curl -fsS http://127.0.0.1:3000/opportunities > /tmp/opportunities.html
          curl -fsS http://127.0.0.1:3000/aashraya > /tmp/aashraya.html
          curl -fsS http://127.0.0.1:3000/samskara > /tmp/samskara.html
          echo "=== / HEAD ==="; sed -n '/<head>/,/<\/head>/p' /tmp/home.html
          echo "=== /resources HEAD ==="; sed -n '/<head>/,/<\/head>/p' /tmp/resources.html
          echo "=== /opportunities HEAD ==="; sed -n '/<head>/,/<\/head>/p' /tmp/opportunities.html
          echo "=== /aashraya HEAD ==="; sed -n '/<head>/,/<\/head>/p' /tmp/aashraya.html
          echo "=== /samskara HEAD ==="; sed -n '/<head>/,/<\/head>/p' /tmp/samskara.html
          echo "=== /robots.txt ==="; curl -fsS http://127.0.0.1:3000/robots.txt
          echo "=== /sitemap.xml ==="; curl -fsS http://127.0.0.1:3000/sitemap.xml
          echo "=== private noindex ==="; curl -fsS http://127.0.0.1:3000/sign-in | grep -o '<meta[^>]*robots[^>]*>' || true
          echo "=== server log ==="; cat /tmp/next-start.log
      - name: Stop server
        if: always()
        run: |
          if test -f /tmp/next.pid; then kill "$(cat /tmp/next.pid)" || true; fi
