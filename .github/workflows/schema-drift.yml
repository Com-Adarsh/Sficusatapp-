name: schema-drift

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Start local Supabase at the production migration boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/all-migrations
          cp supabase/migrations/*.sql /tmp/all-migrations/
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | cut -d_ -f1)"
            case "$v" in
              20261121160535|20261121160657|20261121161121|20261121161135|20261121161244) ;;
              *) rm -f "$f" ;;
            esac
          done
          supabase start
          rm -f supabase/migrations/*.sql
          cp /tmp/all-migrations/*.sql supabase/migrations/

      - name: Dump and normalize production-boundary schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --local --schema public --file /tmp/local-prod-boundary.sql
          normalize() {
            sed -E '/^[[:space:]]*--/d; /^[[:space:]]*$/d' "$1" |
              tr '\n' ' ' |
              tr -s '[:space:]' ' ' |
              sed -E 's/[[:space:]]*;[[:space:]]*/;\n/g' |
              sed -E 's/[[:space:]]+$//' |
              sort
          }
          normalize_snapshot() {
            normalize "$1" |
              grep -Ev '^(create extension |create schema private|create or replace function private\\.|revoke .*function private\\.|grant execute .*function private\\.)' |
              grep -Ev '^(alter schema public owner|create schema public|comment on schema public|grant .* on schema public|revoke .* on schema public)'
          }
          normalize_dump() {
            normalize "$1" |
              grep -Ev '^(set |select pg_catalog\\.set_config|create schema public|alter schema public owner|comment on schema public|grant .* on schema public|revoke .* on schema public)'
          }
          normalize_snapshot docs/prod-schema-snapshot.sql > /tmp/prod-normalized.sql
          normalize_dump /tmp/local-prod-boundary.sql > /tmp/local-normalized.sql
          if ! diff -u /tmp/prod-normalized.sql /tmp/local-normalized.sql > /tmp/schema-diff.patch; then
            echo "::error::Production-boundary schema drift detected."
            sed -n '1,260p' /tmp/schema-diff.patch
            exit 1
          fi
          echo "Production-boundary schema diff is empty."

      - name: Report migrations not yet applied to production
        shell: bash
        run: |
          set -euo pipefail
          echo "Production-applied migration versions:"
          printf '%s\n' 202611210001 20261121161700 20261121162000 20261121162500 20261121163000
          echo "Git migrations not yet applied to production:"
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | cut -d_ -f1)"
            case "$v" in
              20261121160535|20261121160657|20261121161121|20261121161135|20261121161244) ;;
              *) echo "  $f" ;;
            esac
          done

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
