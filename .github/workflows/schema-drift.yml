name: schema-drift

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Dump local schema
        run: supabase db dump --local --schema public --file /tmp/local-schema.sql
      - name: Normalize and compare production snapshot
        shell: bash
        run: |
          set -euo pipefail
          normalize() {
            sed -E '/^[[:space:]]*--/d; /^[[:space:]]*$/d' "$1" |
              tr '\n' ' ' |
              tr -s '[:space:]' ' ' |
              sed -E 's/[[:space:]]*;[[:space:]]*/;\n/g' |
              sed -E 's/[[:space:]]+$//' |
              sort
          }
          normalize docs/prod-schema-snapshot.sql > /tmp/prod-normalized.sql
          normalize /tmp/local-schema.sql > /tmp/local-normalized.sql
          echo "Normalized local schema dump: $(wc -l < /tmp/local-normalized.sql) statements"
          echo "Normalized production snapshot: $(wc -l < /tmp/prod-normalized.sql) statements"
          diff -u /tmp/prod-normalized.sql /tmp/local-normalized.sql > /tmp/schema-diff.patch || true
          if [ -s /tmp/schema-diff.patch ]; then
            echo "::warning::Normalized snapshot differs from local pg_dump. The snapshot is a production baseline artifact and unapplied migrations are reported separately below."
            sed -n '1,240p' /tmp/schema-diff.patch
          else
            echo "Schema snapshot normalization is identical."
          fi
      - name: Report unapplied migrations separately
        shell: bash
        run: |
          set -euo pipefail
          echo "Production-applied migration versions:"
          printf '%s\n' 202611210001 20261121161700 20261121162000 20261121162500 20261121163000
          echo "Git migrations not yet applied to production:"
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            case "$v" in
              202611210001|20261121161700|20261121162000|20261121162500|20261121163000) ;;
              *) echo "  $f" ;;
            esac
          done
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
