name: Phase 2 web checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["phase-1-supabase-foundation"]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_AUTH_ISSUER: ${{ secrets.DEV_SUPABASE_AUTH_ISSUER }}
      CONVEX_DEPLOYMENT: ${{ secrets.DEV_CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.DEV_CONVEX_DEPLOY_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.DEV_CONVEX_URL }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx convex codegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
