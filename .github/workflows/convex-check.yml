name: Convex backend check

on:
  push:
    branches: ["main", "feat/convex-complete-backend"]
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-check.yml"
  pull_request:
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-check.yml"

jobs:
  convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate Convex types and typecheck backend
        run: npx convex codegen --typecheck enable
