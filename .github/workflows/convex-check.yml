name: Convex backend check

on:
  push:
    branches: ["main", "feat/convex-complete-backend"]
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-check.yml"
  pull_request:
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-check.yml"

jobs:
  convex:
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_ISSUER: https://jwhyesglviptvklrclll.supabase.co/auth/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Configure local Convex auth environment
        run: npx convex env set SUPABASE_AUTH_ISSUER "$SUPABASE_AUTH_ISSUER"
      - name: Generate Convex types and typecheck backend
        run: CONVEX_AGENT_MODE=anonymous npx convex dev --once
      - name: Typecheck application and Convex backend
        run: npx tsc --noEmit
